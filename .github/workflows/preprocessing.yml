name: Automated Data Preprocessing

on:
  push:
    paths:
      - 'diabetes_raw/**'
      - 'preprocessing/automate_Muhammad-Ainur-Rofal-Achsony.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Run automated preprocessing
        working-directory: preprocessing
        run: |
          python automate_Muhammad-Ainur-Rofal-Achsony.py \
            --raw_path ../diabetes_raw/diabetes_raw.csv \
            --output_dir diabetes_preprocessing

      - name: Commit and push preprocessed dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/diabetes_preprocessing/
          git diff --staged --quiet || git commit -m "chore: update preprocessed dataset [automated]"
          git push
